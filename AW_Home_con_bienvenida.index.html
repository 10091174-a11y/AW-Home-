.hero-text{position:absolute;left:24px;right:24px;bottom:25px;color:white;text-shadow:0 2px 12px rgba(0,0,0,.3)}
.hero-text .small{font-size:13px;letter-spacing:.12em;text-transform:uppercase;opacity:.9}
.hero-text h1{font-size:35px;margin:5px 0 0;line-height:1.05}
.welcome-body{padding:23px 22px 25px;text-align:center}.welcome-body p{color:var(--muted);margin:7px 0 18px}
.primary{width:100%;border:0;background:var(--brown);color:white;border-radius:15px;padding:14px;font-weight:750}
.login-options{display:none;gap:9px;margin-top:12px}.login-options button{flex:1;border:1px solid var(--line);background:white;border-radius:13px;padding:12px;color:var(--dark)}
#app{display:none;min-height:100vh}.shell{max-width:1100px;margin:auto;padding:18px 16px 80px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}.brand{font-size:23px;font-weight:800}.sub{color:var(--muted);font-size:13px;margin-top:2px}
.add{background:var(--brown);color:white;border:0;border-radius:13px;padding:11px 14px;font-weight:700}
.tabs{display:flex;gap:7px;overflow:auto;margin-bottom:14px;padding-bottom:2px}.tabs button{white-space:nowrap;border:1px solid var(--line);background:var(--cream);color:var(--muted);border-radius:11px;padding:9px 12px}.tabs button.active{background:var(--brown);color:white}
.grid{display:grid;grid-template-columns:1.15fr .85fr;gap:12px}.card{background:var(--cream);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px}
h2,h3{margin:0 0 7px}.card p{margin:0;color:var(--muted);font-size:13px}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:12px}.stat{background:var(--soft);border-radius:13px;padding:10px}.stat b{display:block;font-size:20px}
.item{display:flex;gap:9px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}.item:last-child{border-bottom:0}.main{flex:1;min-width:0}.title{font-weight:700}.meta{font-size:11px;color:var(--muted);margin-top:3px}.dot{width:9px;height:9px;border-radius:50%;background:var(--brown);margin-top:5px;flex:none}.done .title{text-decoration:line-through;opacity:.55}
.actions{display:flex;gap:4px}.mini{border:0;background:var(--soft);border-radius:8px;padding:6px 8px}.empty{text-align:center;color:var(--muted);padding:14px}
.form{display:grid;gap:9px;margin-top:12px}.form input,.form select,.form textarea{width:100%;border:1px solid var(--line);border-radius:11px;padding:10px;background:white;color:var(--dark)}.form textarea{min-height:65px}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.save{background:var(--brown);color:white;border:0;border-radius:11px;padding:11px;font-weight:700}.cancel{background:var(--soft);border:0;border-radius:11px;padding:11px}
.logout{border:1px solid var(--line);background:transparent;border-radius:10px;padding:8px 10px;color:var(--muted);font-size:12px}
@media(max-width:680px){.grid{grid-template-columns:1fr}.row{grid-template-columns:1fr}.hero{height:390px}}
</style>
</head>

</section>

<script>
(()=> {
const $=id=>document.getElementById(id);
const today=()=>new Date().toISOString().slice(0,10);
const fmt=d=>d?new Date(d+"T12:00:00").toLocaleDateString("es",{day:"numeric",month:"short"}):"";
const esc=s=>String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let user=localStorage.getItem("aw_user")||"";
let data=JSON.parse(localStorage.getItem("aw_data")||"[]");
let view="inicio";
const views=[["inicio","Inicio"],["agenda","Agenda"],["weilin","Weilin"],["angel","Ángel"],["nosotros","Nosotros"],["proyectos","Proyectos"],["finanzas","Finanzas"]];

function save(){localStorage.setItem("aw_data",JSON.stringify(data))}
function start(name){user=name;localStorage.setItem("aw_user",name);$("welcome").style.display="none";$("app").style.display="block";$("hello").textContent="Hola, "+name+" 🤎";render()}
$("enter").onclick=()=>{$("options").style.display="flex";$("enter").textContent="¿Quién está entrando?"};
$("options").querySelectorAll("button").forEach(b=>b.onclick=()=>start(b.dataset.user));
$("logout").onclick=()=>{user="";localStorage.removeItem("aw_user");$("app").style.display="none";$("welcome").style.display="flex";$("options").style.display="none";$("enter").textContent="Entrar a A&W Home"};

function renderTabs(){$("tabs").innerHTML=views.map(v=>`<button class="${view===v[0]?"active":""}" data-v="${v[0]}">${v[1]}</button>`).join("");$("tabs").querySelectorAll("button").forEach(b=>b.onclick=()=>{view=b.dataset.v;render()})}
function row(x){
 return `<div class="item"><div class="dot"></div><div class="main ${x.done?"done":""}">
 <div class="title">${esc(x.title)}</div>
 <div class="meta">${esc(x.type)} · ${esc(x.owner)} · ${esc(x.category)} · ${fmt(x.date)}${x.time?" · "+esc(x.time):""}${x.project?" · "+esc(x.project):""}</div>
 ${x.notes?`<div class="meta">${esc(x.notes)}</div>`:""}
 </div><div class="actions"><button class="mini" data-check="${x.id}">${x.done?"↩":"✓"}</button><button class="mini" data-del="${x.id}">×</button></div></div>`;
}
function section(t,arr){return `<div class="card"><h3>${t}</h3>${arr.length?arr.map(row).join(""):'<div class="empty">No hay registros todavía.</div>'}</div>`}
function bind(){
 document.querySelectorAll("[data-check]").forEach(b=>b.onclick=()=>{let x=data.find(i=>i.id===b.dataset.check);if(x){x.done=!x.done;save();render()}});
 document.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{data=data.filter(i=>i.id!==b.dataset.del);save();render()});
}
function render(){
 renderTabs();
 const pending=data.filter(x=>!x.done), todayItems=data.filter(x=>x.date===today());
 const soon=pending.filter(x=>x.date>=today()).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time)).slice(0,12);
 let h="";
 if(view==="inicio"){
  h=`<div class="grid"><div>
  <div class="card"><h2>Hola, Ángel & Weilin 🤎</h2><p>Su centro de control para universidad, trabajo, casa, finanzas y vida juntos.</p>
  <div class="stats"><div class="stat"><b>${todayItems.length}</b>Hoy</div><div class="stat"><b>${pending.length}</b>Pendientes</div><div class="stat"><b>${pending.filter(x=>x.owner==="Ambos").length}</b>Juntos</div><div class="stat"><b>${pending.filter(x=>x.type==="Pago").length}</b>Pagos</div></div></div>
  ${section("📅 Hoy",todayItems)}${section("🔜 Próximamente",soon)}</div>
  <div>${section("🏠 Casa",pending.filter(x=>x.category==="Casa").slice(0,7))}${section("🎓 Universidad / proyectos",pending.filter(x=>x.category==="Universidad"||x.project).slice(0,7))}${section("💰 Finanzas",pending.filter(x=>x.category==="Finanzas"||x.type==="Pago"||x.type==="Ingreso").slice(0,7))}</div></div>`;
 } else if(view==="agenda") h=`<div class="card"><h2>📅 Agenda</h2><p>Todo lo que tienen programado.</p></div>${section("Todos",data.slice().sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time)))}`;
 else if(view==="weilin") h=`<div class="card"><h2>👩🏻 Weilin</h2><p>Universidad, trabajo, proyectos y pendientes personales.</p></div>${section("Mis pendientes",pending.filter(x=>x.owner==="Weilin"))}`;
 else if(view==="angel") h=`<div class="card"><h2>👨🏻 Ángel</h2><p>Sus actividades, pendientes y compromisos.</p></div>${section("Sus pendientes",pending.filter(x=>x.owner==="Ángel"))}`;
 else if(view==="nosotros") h=section("🤎 Nosotros",pending.filter(x=>x.owner==="Ambos"))+section("🏠 Casa",pending.filter(x=>x.category==="Casa"))+section("🛒 Compras",pending.filter(x=>x.type==="Compra"));
 else if(view==="proyectos"){const ps=[...new Set(data.map(x=>x.project).filter(Boolean))];h=`<div class="card"><h2>📚 Proyectos</h2><p>Entregas y tareas organizadas por proyecto.</p></div>`+(ps.length?ps.map(p=>section("📌 "+esc(p),pending.filter(x=>x.project===p))).join(""):'<div class="card"><div class="empty">Todavía no hay proyectos registrados.</div></div>')}
 else h=`<div class="card"><h2>💰 Finanzas</h2><p>Ingresos, pagos y movimientos.</p></div>${section("Movimientos",pending.filter(x=>x.type==="Pago"||x.type==="Ingreso"||x.category==="Finanzas"))}`;
 $("content").innerHTML=h;bind();
}
function openForm(){
 $("formbox").innerHTML=`<div class="card"><h3>➕ Nuevo registro</h3><form class="form" id="f">
 <input id="t" required placeholder="¿Qué necesitas agendar?">
 <div class="row"><select id="ty"><option>Tarea</option><option>Evento</option><option>Entrega</option><option>Compra</option><option>Pago</option><option>Ingreso</option></select>
 <select id="o"><option>Weilin</option><option>Ángel</option><option>Ambos</option></select></div>
 <div class="row"><select id="c"><option>Personal</option><option>Universidad</option><option>Trabajo</option><option>Casa</option><option>Finanzas</option><option>Pareja</option><option>Negocio</option></select>
 <input id="d" type="date" value="${today()}" required></div>
 <div class="row"><input id="tm" type="time"><input id="p" placeholder="Proyecto (opcional)"></div>
 <textarea id="n" placeholder="Notas, monto, detalles..."></textarea>
 <div class="row"><button class="cancel" type="button" id="cx">Cancelar</button><button class="save">Guardar</button></div></form></div>`;
 $("cx").onclick=()=>$("formbox").innerHTML="";
 $("f").onsubmit=e=>{e.preventDefault();data.push({id:Date.now().toString(),title:$("t").value.trim(),type:$("ty").value,owner:$("o").value,category:$("c").value,date:$("d").value,time:$("tm").value,project:$("p").value.trim(),notes:$("n").value.trim(),done:false});save();$("formbox").innerHTML="";render()};
 $("formbox").scrollIntoView({behavior:"smooth"});
}
$("add").onclick=openForm;
if(user)start(user);
})();
</script>
</body>
</html>
